<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SHADOWLINE // FREE DRIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0}#hud{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}
.stat{background:#101614c9;color:#f2ead8;border:1px solid #d9b36b66;border-radius:9px;padding:7px 10px;font-size:11px;letter-spacing:.08em}.stat b{font-size:15px;color:#ffd789}
#controls{position:fixed;inset:auto 0 14px 0;z-index:8;display:flex;justify-content:center;align-items:end;gap:18px;pointer-events:none}
.control{pointer-events:auto;touch-action:none}.pedal{width:78px;height:106px;border:1px solid #d9b36b77;border-radius:17px;background:linear-gradient(#444,#171717);color:#fff;font-weight:800}.brake{height:92px}
#steer{width:145px;height:145px;border:13px solid #191919;border-radius:50%;background:radial-gradient(circle,#777 0 11%,#222 12% 17%,transparent 18%),conic-gradient(#333 0 8%,transparent 8% 25%,#333 25% 33%,transparent 33% 58%,#333 58% 66%,transparent 66%);position:relative}
#steer:after{content:"STEER";position:absolute;left:39px;top:51px;color:#aaa;font-size:11px;font-weight:800}
#hint{position:fixed;bottom:4px;left:0;right:0;text-align:center;color:#ffffff99;font-size:11px;z-index:7;pointer-events:none}
@media(max-width:520px){#steer{width:120px;height:120px}#steer:after{left:30px;top:43px}.pedal{width:65px;height:94px}.controls{gap:9px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<div class="stat">SPEED <b id="speed">0</b> MPH</div>
<div class="stat">HEADING <b id="heading">N</b></div>
<div class="stat">DISTANCE <b id="distance">0.00</b> MI</div>
<div class="stat">DRIVE <b>FREE ROAM</b></div>
</div>
<div id="controls">
<button id="brake" class="control pedal brake">BRAKE</button>
<div id="steer" class="control" aria-label="Steering wheel"></div>
<button id="gas" class="control pedal">GAS</button>
</div>
<div id="hint">Hold GAS to drive • drag the wheel to steer • W/A/S/D also work</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
