<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>SHADOWLINE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#070806;color:#e8dcc4;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b100e}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#top{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#e8b86d}
#obj{text-align:right;color:#d7efe0}
#xhair{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border:1px solid rgba(232,184,109,.85)}
#bot{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end}
.bar{width:140px;height:8px;background:#222;border:1px solid rgba(232,184,109,.35)}
#hp{height:100%;width:100%;background:#7dffb3}
#ammo{font-size:24px;font-weight:700;text-align:right}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);letter-spacing:.16em;font-size:12px;color:#e8b86d;opacity:0}
#toast.show{opacity:1}
#touch{position:fixed;inset:0;z-index:8;pointer-events:none}
#stick{pointer-events:auto;position:absolute;left:18px;bottom:16px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(232,184,109,.3)}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(232,184,109,.5)}
#touch button{pointer-events:auto;position:absolute;border:1px solid rgba(232,184,109,.4);background:rgba(8,10,8,.55);color:#e8b86d;letter-spacing:.12em;font-size:11px;font-weight:700;border-radius:50%}
#fire{right:16px;bottom:16px;width:84px;height:84px;background:rgba(226,74,59,.35);color:#ffd7d2}
#aim{right:108px;bottom:16px;width:54px;height:54px}
#rld{right:102px;bottom:80px;width:48px;height:48px}
#jmp{right:16px;bottom:108px;width:48px;height:48px}
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#070908;padding:24px}
.op{color:#e8b86d;letter-spacing:.34em;font-size:11px;margin-bottom:8px}
h1{font-size:clamp(34px,9vw,68px);letter-spacing:.08em;line-height:.9}
h2{font-size:clamp(22px,6vw,36px);margin-bottom:10px}
.tag{margin-top:10px;letter-spacing:.28em;font-size:11px;color:#9a6f32}
.log{margin:12px 0 20px;color:#9aa394}
.cta,.ghost{pointer-events:auto;border:1px solid #e8b86d;background:rgba(232,184,109,.14);color:#f6e7c8;letter-spacing:.18em;font-size:12px;padding:12px 16px;margin:6px 8px 0 0}
.ghost{background:transparent;border-color:#444;color:#aaa}
.hint{margin-top:12px;font-size:12px;color:#7d8378}
.brief{color:#c9c2b0;line-height:1.55;margin:8px 0 14px;max-width:560px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
<div id="top"><span id="tag">M1 // DOCKSIDE</span><span id="obj">CLEAR HOSTILES</span></div>
<div id="xhair"></div>
<div id="bot"><div class="bar"><div id="hp"></div></div><div id="ammo"><span id="mag">30</span> / <span id="res">90</span></div></div>
<div id="toast"></div>
</div>
<div id="touch" class="hidden">
<div id="stick"><div id="knob"></div></div>
<button id="aim" type="button">ADS</button>
<button id="rld" type="button">RLD</button>
<button id="fire" type="button">FIRE</button>
<button id="jmp" type="button">JMP</button>
</div>
<div id="screens">
<section id="title" class="screen"><div>
<div class="op">OPERATION</div><h1>SHADOWLINE</h1>
<p class="tag">FIRST-PERSON CAMPAIGN</p>
<p class="log">GHOST UNIT // SGT. KANE</p>
<button id="start" class="cta">INITIATE DEPLOYMENT</button>
<p class="hint">Turn sideways. Stick to move. Swipe to look. FIRE.</p>
</div></section>
<section id="brief" class="screen hidden"><div>
<div class="op" id="bcode">FILE 01 / 03</div>
<h2 id="btitle">DOCKSIDE</h2>
<p class="brief" id="bbody"></p>
<button id="deploy" class="cta">DEPLOY</button>
</div></section>
<section id="done" class="screen hidden"><div>
<div class="op" id="dcode">COMPLETE</div>
<h2 id="dtitle">SECTOR CLEARED</h2>
<p class="brief" id="dbody"></p>
<button id="next" class="cta">NEXT MISSION</button>
</div></section>
<section id="dead" class="screen hidden"><div>
<div class="op">KIA</div><h2>OPERATOR DOWN</h2>
<button id="retry" class="cta">RESPAWN</button>
<button id="abort" class="ghost">TITLE</button>
</div></section>
<section id="win" class="screen hidden"><div>
<div class="op">CAMPAIGN COMPLETE</div><h2>SHADOWLINE CLOSED</h2>
<button id="home" class="cta">TITLE</button>
</div></section>
</div>
<script src="game.js"></script>
</body>
</html>
